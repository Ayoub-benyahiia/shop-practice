<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Document</title>
</head>

<body>
    <section>
        <header class="flex flex-row justify-between items-center gap-4 p-4 border-b border-gray-200">
            <div><logo class="font-bold text-2xl text-black"></logo></div>
            <div class="flex flex-row items-center gap-6">
                <p class="text-gray-700 hover:text-blue-500 cursor-pointer">Catalog</p>
                <p class="text-gray-700 hover:text-blue-500 cursor-pointer">Panier</p>
                <p class="text-blue-500 font-semibold cursor-pointer">Mes Reservations</p>
            </div>

        </header>
        <div class="flex flex-col items-center justify-center bg-blue-500 p-4 gap-2">
            <icon class="text-white text-3xl"></icon>
            <h1 class="font-manrope font-bold text-4xl text-white">Mes Reservations</h1>
            <p class="text-white text-sm"></p>

        </div>
    </section>

    <section class="partofsearch flex flex-col items-center gap-4 p-4 bg-gray-50">
        <p class="font-manrope font-bold text-sm text-black">Votre adresse Email</p>
        <form id="form" class="flex flex-row gap-2">
            <input type="search" id="search-input" name="q" placeholder="Rechercher un produit..."
                class="border bg-white border-gray-300 rounded-lg gap-2 p-2">
            <button class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 ">Search</button>
        </form>
    </section>

    <section class="flex flex-row items-center gap-6 p-4 m-4 bg-white border border-gray-200 rounded-xl">
        <div><img class="w-32 h-32 object-cover rounded-lg bg-gray-100"></div>
        <div class="flex flex-col gap-1">
            <h3 class="font-manrope font-bold text-xl text-black">Title</h3>
            <p class="text-sm text-gray-700">Quantity</p>
            <p class="text-sm text-gray-700">prix unitaire</p>
            <p class="text-sm font-semibold text-black">total </p>
        </div>


    </section>
</body>

</html>
